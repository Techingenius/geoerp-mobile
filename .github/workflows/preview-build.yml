name: Android Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        id: build
        run: |
          EAS_STDERR=$(mktemp)
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json 2>"$EAS_STDERR") || true
          EAS_LOGS=$(cat "$EAS_STDERR")
          rm -f "$EAS_STDERR"

          # Show EAS stderr logs for debugging
          if [ -n "$EAS_LOGS" ]; then
            echo "--- EAS Logs ---"
            echo "$EAS_LOGS"
            echo "--- End Logs ---"
          fi

          BUILD_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl // empty' 2>/dev/null)
          BUILD_PAGE=$(echo "$BUILD_OUTPUT" | jq -r '.[0].buildDetailsPageUrl // empty' 2>/dev/null)

          if [ -z "$BUILD_URL" ]; then
            echo "::error::EAS Build failed or returned no artifact URL"
            echo "--- EAS Build JSON Output ---"
            echo "$BUILD_OUTPUT"
            echo "--- End Output ---"
            exit 1
          fi

          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "build_page=$BUILD_PAGE" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.build.outputs.build_url }}';
            const buildPage = '${{ steps.build.outputs.build_page }}';
            const body = [
              '## 📱 Android Preview Build',
              '',
              `**[⬇️ Download APK](${buildUrl})**`,
              '',
              `[View build details](${buildPage})`,
              '',
              `Built from commit \`${context.sha.substring(0, 7)}\``,
            ].join('\n');

            // Delete previous bot comments to keep PR clean
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.body.includes('## 📱 Android Preview Build')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
